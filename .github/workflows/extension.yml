# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Update Website CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch :

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run build:firefox

      - name: Extract version from manifest.json
        id: get_version
        run: |
          VERSION=$(grep '"version"' public/manifest.json | sed -E 's/.*"version": "([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Zip Extension for Reviewer
        run: |
          zip -r -FS warthog_extension_reviewer.zip * --exclude '*.git*'

      - name: Zip Extension
        run: |
          cd build
          zip -r -FS ../warthog_extension.zip * --exclude '*.git*'

      - name: Zip Firefox Extension
        run: |
          cd build-firefox
          zip -r -FS ../warthog_extension_firefox.zip * --exclude '*.git*'

      - name: Build IPv4 forwarder AppImage
        run: |
          chmod +x scripts/build-forwarder-appimage.sh
          ./scripts/build-forwarder-appimage.sh dist

      - name: Pack Windows IPv4 forwarder
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 zip
          chmod +x scripts/build-forwarder-windows.sh
          ./scripts/build-forwarder-windows.sh dist

      - name: sign the extension
        continue-on-error: true
        uses: cardinalby/webext-buildtools-firefox-sign-xpi-action@v1
        with:
          timeoutMs: 2000000
          zipFilePath: 'warthog_extension_firefox.zip'
          xpiFilePath: 'warthog_extension_firefox.xpi'
          jwtIssuer: ${{ secrets.FF_JWT_ISSUER }}
          jwtSecret: ${{ secrets.FF_JWT_SECRET }}
          extensionId: ${{ secrets.FF_EXTENSION_ID }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: warthog_extension ${{ env.VERSION }}
          files: |
            warthog_extension_reviewer.zip
            warthog_extension.zip
            warthog_extension_firefox.zip
            warthog_extension_firefox.xpi
            dist/Warthog_IPv4_forwarder-x86_64.AppImage
            dist/Warthog_IPv4_forwarder-windows.zip

